<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Tipps – WM 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #060e1e; --card: #0c1a30; --card2: #101f38;
    --border: #1a2f50; --gold: #f5c842; --gold2: #e6a800;
    --blue: #2563eb; --text: #e8eef8; --muted: #607090;
    --green: #22c55e; --orange: #f97316; --red: #ef4444;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* LOGIN OVERLAY */
  #loginScreen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  .login-wrap { width: 100%; max-width: 360px; text-align: center; }
  .login-logo { font-size: 52px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .login-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 2px;
    background: linear-gradient(135deg,#fff,var(--gold));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    margin-bottom: 4px;
  }
  .login-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 28px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
  .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; }
  .login-card h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
  .login-name-tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(245,200,66,0.1); border: 1px solid rgba(245,200,66,0.25);
    border-radius: 20px; padding: 4px 12px;
    color: var(--gold); font-size: 0.82rem; font-weight: 700;
    margin-bottom: 20px;
  }
  .login-card input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 2px solid var(--border); background: #080f1d;
    color: var(--text); font-size: 1.1rem; letter-spacing: 4px;
    text-align: center; outline: none; margin-bottom: 12px;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.2s;
  }
  .login-card input:focus { border-color: var(--blue); }
  .login-btn {
    width: 100%; padding: 14px; border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), #1d4ed8);
    color: #fff; font-size: 1rem; font-weight: 700;
    border: none; cursor: pointer; transition: all 0.18s;
    font-family: 'Inter', sans-serif;
  }
  .login-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .login-btn:active { transform: scale(0.98); }
  .login-error { color: var(--red); font-size: 0.85rem; margin-top: 10px; min-height: 20px; font-weight: 500; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0a1628, #0d2244);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .header-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .back {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;
    color: var(--muted); text-decoration: none; font-size: 1.1rem; flex-shrink: 0;
  }
  .back:hover { background: rgba(255,255,255,0.1); }
  .header-info { flex: 1; }
  .header-name { font-size: 1rem; font-weight: 700; }
  .header-sub { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
  .pts-badge {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #1a0f00; font-size: 0.8rem; font-weight: 800;
    padding: 5px 12px; border-radius: 20px; white-space: nowrap;
  }
  .info-strip {
    padding: 7px 16px; background: rgba(37,99,235,0.08);
    border-top: 1px solid rgba(37,99,235,0.15);
    font-size: 0.72rem; color: var(--muted); font-weight: 500;
    display: flex; gap: 16px;
  }
  .info-strip span { display: flex; align-items: center; gap: 4px; }

  /* MATCH LIST */
  main { max-width: 640px; margin: 0 auto; padding: 16px 12px 80px; }
  .day-group { margin-bottom: 20px; }
  .day-label {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 2px; color: var(--muted); margin-bottom: 8px;
    padding: 0 4px; display: flex; align-items: center; gap: 8px;
  }
  .day-label::after { content:''; flex:1; height:1px; background:var(--border); }

  .match-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 6px;
    transition: border-color 0.2s;
  }
  .match-card:hover { border-color: #253d60; }
  .match-card.locked { opacity: 0.6; }
  .match-top {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .grp-badge {
    font-size: 0.62rem; font-weight: 800; padding: 2px 7px;
    border-radius: 6px; background: rgba(245,200,66,0.12);
    color: var(--gold); letter-spacing: 0.5px;
  }
  .match-time { font-size: 0.68rem; color: var(--muted); margin-left: auto; }
  .lock-badge {
    font-size: 0.68rem; color: var(--muted);
    display: flex; align-items: center; gap: 3px;
  }
  .match-teams {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 10px;
  }
  .team-name { font-size: 0.88rem; font-weight: 700; }
  .team-home { text-align: right; }
  .team-away { text-align: left; }
  .score-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .score-inputs { display: flex; align-items: center; gap: 5px; }
  .score-inputs input {
    width: 42px; height: 42px; border-radius: 10px;
    border: 2px solid var(--border); background: #080f1d;
    color: #fff; font-size: 1.15rem; font-weight: 700;
    text-align: center; outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.2s, background 0.2s;
    -moz-appearance: textfield;
  }
  .score-inputs input::-webkit-outer-spin-button,
  .score-inputs input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .score-inputs input:focus { border-color: var(--blue); background: #0a1525; }
  .score-inputs input:disabled { opacity: 0.4; cursor: not-allowed; }
  .score-sep { font-size: 1.3rem; font-weight: 800; color: var(--border); }
  .save-indicator { height: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 0.65rem; font-weight: 600; }
  .save-indicator.saving { color: var(--gold); }
  .save-indicator.saved  { color: var(--green); }
  .save-indicator.error  { color: var(--red); }
  .pts-pill {
    font-size: 0.72rem; font-weight: 800; padding: 2px 8px;
    border-radius: 10px; white-space: nowrap;
  }
  .pp3 { background:rgba(34,197,94,0.15); color:var(--green); }
  .pp2 { background:rgba(245,200,66,0.15); color:var(--gold); }
  .pp1 { background:rgba(249,115,22,0.15); color:var(--orange); }
  .pp0 { background:rgba(239,68,68,0.1); color:var(--red); }

  /* BOTTOM BAR */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(6,14,30,0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
    max-width: 640px; margin: 0 auto; left: 50%; transform: translateX(-50%); width: 100%;
  }
  .bottom-bar .label { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
  .bottom-bar .total { font-size: 1.4rem; font-weight: 800; color: var(--gold); }
  .bottom-bar .sub { font-size: 0.68rem; color: var(--muted); }

  #loading { text-align: center; padding: 60px 20px; color: var(--muted); }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-logo">⚽</div>
    <div class="login-title">WM 2026</div>
    <div class="login-sub">Familie Voigt · Tippspiel</div>
    <div class="login-card">
      <h2>Willkommen!</h2>
      <div class="login-name-tag">👤 <span id="loginName">…</span></div>
      <input type="password" id="pwInput" placeholder="Passwort" autocomplete="current-password">
      <button class="login-btn" onclick="doLogin()">Einloggen ›</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<header>
  <div class="header-top">
    <a href="../" class="back">←</a>
    <div class="header-info">
      <div class="header-name">⚽ <span id="participantName">…</span>s Tipps</div>
      <div class="header-sub">WM 2026 · Familie Voigt</div>
    </div>
    <a href="../dashboard/" class="pts-badge" style="text-decoration:none">🏆 Rangliste</a>
  </div>
  <div class="info-strip">
    <span>🔒 Gesperrt nach Anstoß</span>
    <span>💾 Auto-Speichern</span>
    <span>Format: 2:1</span>
  </div>
</header>

<main>
  <div id="loading"><div class="spinner"></div>Lade Spiele…</div>
  <div id="matchList"></div>
</main>

<div class="bottom-bar">
  <div>
    <div class="label">Rangliste &amp; Punkte</div>
    <div class="sub">Vergleich mit allen Teilnehmern</div>
  </div>
  <a href="../dashboard/" class="total" style="text-decoration:none;cursor:pointer">→</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mfqsjhrdjncviebqezls.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vccXpqiZfjyH099V0Ua-Qg_k8dhJ3Vg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(location.search);
const PARTICIPANT = params.get('name') || '';
const VALID = ['Nolan','Leonie','Anna','Georg','Esther','Snezhana','Oliver'];
const PASSWORDS = { Nolan:'wolf', Leonie:'rose', Anna:'berg', Georg:'meer', Esther:'licht', Snezhana:'sand', Oliver:'gold' };
const AVATARS = { Nolan:'#2563eb', Leonie:'#db2777', Anna:'#0891b2', Georg:'#d97706', Esther:'#059669', Snezhana:'#7c3aed', Oliver:'#f59e0b' };

if (!VALID.includes(PARTICIPANT)) {
  document.body.innerHTML = '<div style="text-align:center;padding:80px 20px;color:#ef4444;font-size:1.1rem">Ungültiger Teilnehmer.<br><br><a href="../" style="color:#2563eb;font-weight:700">← Zurück zur Startseite</a></div>';
  throw new Error('invalid');
}

document.getElementById('loginName').textContent = PARTICIPANT;
document.getElementById('participantName').textContent = PARTICIPANT;
document.title = `${PARTICIPANT}s Tipps – WM 2026`;

const SESSION_KEY = `wm2026_auth_${PARTICIPANT}`;

function doLogin() {
  const pw = document.getElementById('pwInput').value.trim().toLowerCase();
  if (pw === PASSWORDS[PARTICIPANT]) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('loginScreen').style.display = 'none';
    load();
  } else {
    const err = document.getElementById('loginError');
    err.textContent = '❌ Falsches Passwort – versuch es nochmal';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
    setTimeout(() => err.textContent = '', 3000);
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

if (sessionStorage.getItem(SESSION_KEY)) {
  document.getElementById('loginScreen').style.display = 'none';
  load();
}

function calcPoints(tip, result) {
  if (!tip || !result) return null;
  const [th, ta] = tip.split(':').map(Number);
  const [rh, ra] = result.split(':').map(Number);
  if ([th,ta,rh,ra].some(isNaN)) return null;
  if (th===rh && ta===ra) return 3;
  if (th-ta===rh-ra) return 2;
  if (Math.sign(th-ta)===Math.sign(rh-ra)) return 1;
  return 0;
}

function fmtTime(utc) {
  return new Date(utc).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'}) + ' Uhr';
}

let matches=[], tips={}, saveTimers={};

async function load() {
  const [mRes, tRes] = await Promise.all([
    sb.from('matches').select('*').order('kickoff_utc'),
    sb.from('tips').select('*').eq('participant', PARTICIPANT)
  ]);
  matches = mRes.data || [];
  (tRes.data||[]).forEach(t => tips[t.match_id] = t.tip);
  render();
}

function render() {
  const now = new Date();
  const localDateKey=utc=>new Date(utc).toLocaleDateString('sv-SE',{timeZone:'Europe/Berlin'});
  const byDate = {};
  matches.forEach(m => {const k=localDateKey(m.kickoff_utc);(byDate[k]=byDate[k]||[]).push(m);});

  const html = Object.entries(byDate).map(([date, ms]) => {
    const open = ms.filter(m => new Date(m.kickoff_utc) > now && m.home !== '?' && m.away !== '?');
    if (!open.length) return '';
    const rows = open.map(m => {
      const locked = false;
      const tip = tips[m.id]||'';
      const [th='',ta=''] = tip ? tip.split(':') : ['',''];
      const pts = calcPoints(tip, m.result);

      const ptsBadge = pts!==null
        ? `<span class="pts-pill pp${pts}">${pts===3?'✓✓✓ ':pts===2?'✓✓ ':pts===1?'✓ ':'✗ '}${pts} Pkt</span>`
        : '';

      const lockEl = locked
        ? `<div class="lock-badge">🔒 Gesperrt</div>`
        : `<div class="save-indicator" id="dot-${m.id}"></div>`;

      return `<div class="match-card${locked?' locked':''}">
        <div class="match-top">
          <span class="grp-badge">GR. ${m.group_name}</span>
          <span class="match-time">${fmtTime(m.kickoff_utc)}</span>
        </div>
        <div class="match-teams">
          <div class="team-name team-home">${m.home}</div>
          <div class="score-wrap">
            <div class="score-inputs">
              <input type="number" min="0" max="20" id="h-${m.id}" value="${th}" ${locked?'disabled':''} data-id="${m.id}" placeholder="–">
              <span class="score-sep">:</span>
              <input type="number" min="0" max="20" id="a-${m.id}" value="${ta}" ${locked?'disabled':''} data-id="${m.id}" placeholder="–">
            </div>
            ${lockEl}
            ${ptsBadge}
          </div>
          <div class="team-name team-away">${m.away}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="day-group">
      <div class="day-label">📅 ${new Date(date+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'})}</div>
      ${rows}
    </div>`;
  }).join('');

  document.getElementById('loading').style.display='none';
  document.getElementById('matchList').innerHTML=html;

  document.querySelectorAll('.score-inputs input').forEach(inp => {
    inp.addEventListener('input', onInput);
  });
}

function onInput(e) {
  const id = parseInt(e.target.dataset.id);
  const h = document.getElementById('h-'+id).value.trim();
  const a = document.getElementById('a-'+id).value.trim();
  if (h===''||a==='') return;
  clearTimeout(saveTimers[id]);
  setDot(id,'saving','⏳ Speichere…');
  saveTimers[id] = setTimeout(()=>saveTip(id,`${h}:${a}`), 700);
}

function setDot(id, state, msg='') {
  const el = document.getElementById('dot-'+id);
  if (el) { el.className='save-indicator '+state; el.textContent=msg; }
}

async function saveTip(id, tip) {
  tips[id]=tip;
  const {error} = await sb.from('tips').upsert(
    {match_id:id, participant:PARTICIPANT, tip, updated_at:new Date().toISOString()},
    {onConflict:'match_id,participant'}
  );
  if (error) { setDot(id,'error','❌ Fehler'); }
  else { setDot(id,'saved','✓ Gespeichert'); setTimeout(()=>setDot(id,'',''),2500); }
}

function updateTotal() {
}

sb.channel('results').on('postgres_changes',{event:'UPDATE',schema:'public',table:'matches'},payload=>{
  const m=matches.find(x=>x.id===payload.new.id);
  if(m){m.result=payload.new.result;render();}
}).subscribe();
</script>
</body>
</html>
