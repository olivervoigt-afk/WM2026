<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – WM 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#060e1e; --card:#0c1a30; --card2:#101f38; --border:#1a2f50;
    --gold:#f5c842; --gold2:#e6a800; --blue:#2563eb; --text:#e8eef8;
    --muted:#607090; --green:#22c55e; --orange:#f97316; --red:#ef4444;
  }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  /* LOGIN */
  #loginScreen {
    position:fixed;inset:0;background:var(--bg);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;
  }
  .login-wrap{width:100%;max-width:360px;text-align:center;}
  .login-logo{font-size:48px;margin-bottom:10px;}
  .login-title{
    font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:2px;
    background:linear-gradient(135deg,#fff,var(--gold));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:4px;
  }
  .login-sub{font-size:0.78rem;color:var(--muted);margin-bottom:28px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;}
  .login-card h2{font-size:1.15rem;font-weight:700;margin-bottom:4px;}
  .login-card p{color:var(--muted);font-size:0.82rem;margin-bottom:20px;}
  .login-card input{
    width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--border);
    background:#080f1d;color:var(--text);font-size:1.1rem;letter-spacing:4px;
    text-align:center;outline:none;margin-bottom:12px;font-family:'Inter',sans-serif;
    transition:border-color 0.2s;
  }
  .login-card input:focus{border-color:var(--blue);}
  .login-btn{
    width:100%;padding:14px;border-radius:12px;
    background:linear-gradient(135deg,#1e3a5f,var(--blue));
    color:#fff;font-size:1rem;font-weight:700;border:none;cursor:pointer;
    font-family:'Inter',sans-serif;transition:all 0.18s;
  }
  .login-btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .login-error{color:var(--red);font-size:0.85rem;margin-top:10px;min-height:20px;font-weight:500;}

  /* HEADER */
  header{background:linear-gradient(135deg,#0a1628,#0d2244);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .header-inner{display:flex;align-items:center;gap:12px;padding:12px 16px;}
  .back{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-size:1.1rem;}
  .back:hover{background:rgba(255,255,255,0.1);}
  .header-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1.5px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header-sub{font-size:0.7rem;color:var(--muted);margin-top:1px;font-weight:500;}

  /* STATS */
  main{max-width:680px;margin:0 auto;padding:16px 12px 40px;}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center;}
  .stat-num{font-size:1.8rem;font-weight:800;color:var(--gold);line-height:1;}
  .stat-label{font-size:0.68rem;color:var(--muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}

  /* SECTION LABEL */
  .sec-label{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
  .sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

  /* DAY */
  .day-label{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:16px 0 8px;padding:0 2px;display:flex;align-items:center;gap:8px;}
  .day-label::after{content:'';flex:1;height:1px;background:var(--border);}

  /* MATCH ROW */
  .match-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;transition:border-color 0.18s;}
  .match-row:hover{border-color:#253d60;}
  .grp-tag{font-size:0.6rem;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(245,200,66,0.12);color:var(--gold);flex-shrink:0;}
  .match-info{flex:1;min-width:0;}
  .match-name{font-size:0.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .match-time{font-size:0.67rem;color:var(--muted);margin-top:2px;}
  .result-form{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .result-form input{
    width:38px;height:38px;border-radius:9px;border:2px solid var(--border);
    background:#080f1d;color:#fff;font-size:1rem;font-weight:700;
    text-align:center;outline:none;font-family:'Inter',sans-serif;
    -moz-appearance:textfield;transition:border-color 0.2s;
  }
  .result-form input::-webkit-outer-spin-button,
  .result-form input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .result-form input:focus{border-color:var(--blue);}
  .sep{color:var(--muted);font-weight:800;font-size:1.1rem;}
  .save-btn{
    background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);
    color:var(--green);font-size:0.75rem;font-weight:700;
    padding:7px 11px;border-radius:9px;cursor:pointer;
    font-family:'Inter',sans-serif;transition:all 0.18s;white-space:nowrap;
  }
  .save-btn:hover{background:rgba(34,197,94,0.2);}
  .save-btn:disabled{opacity:0.4;cursor:default;}
  .ok-badge{font-size:0.72rem;color:var(--green);font-weight:700;animation:fadeOut 2.5s forwards;}
  @keyframes fadeOut{0%,60%{opacity:1}100%{opacity:0}}
  .not-started{font-size:0.72rem;color:var(--muted);font-style:italic;}
  .has-result{background:rgba(34,197,94,0.06);border-color:rgba(34,197,94,0.2);}

  #loading{text-align:center;padding:60px 20px;color:var(--muted);}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-logo">🔧</div>
    <div class="login-title">Admin</div>
    <div class="login-sub">WM 2026 · Familie Voigt</div>
    <div class="login-card">
      <h2>Admin-Zugang</h2>
      <p>Nur für den Spielleiter</p>
      <input type="password" id="pwInput" placeholder="Passwort" autocomplete="current-password">
      <button class="login-btn" onclick="doLogin()">Einloggen ›</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>
</div>

<header>
  <div class="header-inner">
    <a href="../" class="back">←</a>
    <div>
      <div class="header-title">🔧 WM 2026 Admin</div>
      <div class="header-sub">Ergebnisse eintragen · Familie Voigt</div>
    </div>
  </div>
</header>

<main id="adminContent" style="display:none">
  <div id="loading"><div class="spinner"></div>Lade Spiele…</div>
  <div id="inner" style="display:none">
    <div class="sec-label">Übersicht</div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="statPlayed">–</div><div class="stat-label">Gespielt</div></div>
      <div class="stat-card"><div class="stat-num" id="statDone" style="color:var(--green)">–</div><div class="stat-label">Eingetragen</div></div>
      <div class="stat-card"><div class="stat-num" id="statOpen" style="color:var(--orange)">–</div><div class="stat-label">Ausstehend</div></div>
    </div>
    <div class="sec-label">Ergebnisse eingeben</div>
    <div id="matchList"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://mfqsjhrdjncviebqezls.supabase.co';
const SUPABASE_KEY='sb_publishable_vccXpqiZfjyH099V0Ua-Qg_k8dhJ3Vg';
const ADMIN_PW='123';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function doLogin(){
  const pw=document.getElementById('pwInput').value.trim();
  if(pw===ADMIN_PW){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('adminContent').style.display='block';
    loadMatches();
  } else {
    const err=document.getElementById('loginError');
    err.textContent='❌ Falsches Passwort';
    document.getElementById('pwInput').value='';
    setTimeout(()=>err.textContent='',3000);
  }
}

function fmtTime(utc){
  return new Date(utc).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'})+' Uhr';
}

let matches=[];

async function loadMatches(){
  const{data}=await sb.from('matches').select('*').order('kickoff_utc');
  matches=data||[];
  renderMatches();
  document.getElementById('loading').style.display='none';
  document.getElementById('inner').style.display='block';
}

function renderMatches(){
  const now=new Date();
  const played=matches.filter(m=>new Date(m.kickoff_utc)<=now);
  const done=matches.filter(m=>m.result);
  document.getElementById('statPlayed').textContent=played.length;
  document.getElementById('statDone').textContent=done.length;
  document.getElementById('statOpen').textContent=played.length-done.length;

  const cutoff=new Date(now.getTime()-24*60*60*1000);
  const showOld=window._showOldMatches||false;
  const visible=showOld?matches:matches.filter(m=>new Date(m.kickoff_utc)>=cutoff);
  const hiddenCount=matches.length-visible.length;
  const byDate={};
  visible.forEach(m=>(byDate[m.match_date]=byDate[m.match_date]||[]).push(m));

  const toggleHtml=hiddenCount>0&&!showOld
    ?`<div style="text-align:center;margin-bottom:14px"><button onclick="window._showOldMatches=true;renderMatches()" style="background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--muted);font-size:0.8rem;font-weight:600;padding:8px 18px;border-radius:20px;cursor:pointer;font-family:inherit">🕓 ${hiddenCount} ältere Spiele einblenden</button></div>`
    :showOld?`<div style="text-align:center;margin-bottom:14px"><button onclick="window._showOldMatches=false;renderMatches()" style="background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--muted);font-size:0.8rem;font-weight:600;padding:8px 18px;border-radius:20px;cursor:pointer;font-family:inherit">✕ Alte Spiele ausblenden</button></div>`
    :'';

  document.getElementById('matchList').innerHTML=toggleHtml+Object.entries(byDate).map(([date,ms])=>{
    const rows=ms.map(m=>{
      const started=new Date(m.kickoff_utc)<=now;
      const[rh='',ra='']=m.result?m.result.split(':'):['',''];
      return`<div class="match-row${m.result?' has-result':''}" id="row-${m.id}">
        <span class="grp-tag">GR.${m.group_name}</span>
        <div class="match-info">
          <div class="match-name">${m.home} – ${m.away}</div>
          <div class="match-time">${fmtTime(m.kickoff_utc)}</div>
        </div>
        ${started?`
        <div class="result-form">
          <input type="number" min="0" max="20" id="rh-${m.id}" value="${rh}" placeholder="–">
          <span class="sep">:</span>
          <input type="number" min="0" max="20" id="ra-${m.id}" value="${ra}" placeholder="–">
          <button class="save-btn" onclick="saveResult(${m.id})" id="btn-${m.id}">${m.result?'✓ Update':'Speichern'}</button>
          <span id="ok-${m.id}"></span>
        </div>`:`<span class="not-started">Noch nicht</span>`}
      </div>`;
    }).join('');
    return`<div class="day-label">📅 ${date.split('.')[0]}. Juni 2026</div>${rows}`;
  }).join('');
}

async function saveResult(id){
  const h=document.getElementById('rh-'+id).value;
  const a=document.getElementById('ra-'+id).value;
  if(h===''||a===''){alert('Bitte beide Tore eingeben');return;}
  const btn=document.getElementById('btn-'+id);
  btn.disabled=true;btn.textContent='…';
  const{error}=await sb.from('matches').update({result:`${h}:${a}`}).eq('id',id);
  if(error){alert('Fehler: '+error.message);btn.disabled=false;btn.textContent='Speichern';}
  else{
    const ok=document.getElementById('ok-'+id);
    ok.className='ok-badge';ok.textContent='✓';
    const m=matches.find(x=>x.id===id);if(m)m.result=`${h}:${a}`;
    setTimeout(()=>renderMatches(),2600);
  }
}
</script>
</body>
</html>
