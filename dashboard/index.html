<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard – WM 2026 Familie Voigt</title>
<link rel="icon" type="image/png" href="../ball.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#060e1e; --card:#0c1a30; --card2:#101f38; --border:#1a2f50;
    --gold:#f5c842; --gold2:#e6a800; --blue:#2563eb; --text:#e8eef8;
    --muted:#607090; --green:#22c55e; --orange:#f97316; --red:#ef4444;
  }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  /* HEADER */
  header {
    background: linear-gradient(135deg,#0a1628,#0d2244);
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; z-index:20;
  }
  .header-inner { display:flex; align-items:center; gap:12px; padding:12px 16px; }
  .back {
    width:34px;height:34px;border-radius:10px;
    background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;
    color:var(--muted);text-decoration:none;font-size:1.1rem;flex-shrink:0;
  }
  .back:hover{background:rgba(255,255,255,0.1);}
  .header-text { flex:1; }
  .header-title {
    font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:1.5px;
    background:linear-gradient(135deg,#fff,var(--gold));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .header-sub { font-size:0.7rem; color:var(--muted); margin-top:1px; font-weight:500; }
  .live-pill {
    display:flex;align-items:center;gap:5px;
    background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);
    border-radius:20px;padding:4px 10px;font-size:0.7rem;font-weight:700;color:var(--green);
  }
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

  /* TABS */
  .tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg); }
  .tab {
    flex:1; padding:11px 0; text-align:center; font-size:0.82rem; font-weight:700;
    color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;
    transition:all 0.18s; letter-spacing:0.5px;
  }
  .tab.active { color:var(--gold); border-bottom-color:var(--gold); }

  main { max-width:700px; margin:0 auto; padding:16px 12px 40px; }

  /* STANDINGS */
  #tabStandings{}
  .podium { display:flex; align-items:flex-end; justify-content:center; gap:10px; margin:8px 0 20px; }
  .podium-item { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; min-width:0; }
  .podium-avatars { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .podium-names { display:flex; flex-direction:column; align-items:center; gap:1px; }
  .podium-avatar {
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#fff; flex-shrink:0;
    border:3px solid transparent;
  }
  .podium-1 .podium-avatar { width:60px;height:60px;font-size:1.3rem;border-color:var(--gold); box-shadow:0 0 20px rgba(245,200,66,0.4); }
  .podium-1 .podium-avatar.small { width:42px;height:42px;font-size:1rem; }
  .podium-2 .podium-avatar { width:52px;height:52px;font-size:1.1rem;border-color:#c0c0c0; }
  .podium-2 .podium-avatar.small { width:36px;height:36px;font-size:0.9rem; }
  .podium-3 .podium-avatar { width:46px;height:46px;font-size:1rem;border-color:#cd7f32; }
  .podium-3 .podium-avatar.small { width:32px;height:32px;font-size:0.82rem; }
  .podium-name { font-size:0.78rem; font-weight:700; text-align:center; }
  .podium-name.small { font-size:0.68rem; }
  .podium-pts { font-size:1.1rem; font-weight:800; color:var(--gold); }
  .podium-medal { font-size:2.1rem; }
  .podium-bar {
    width:100%; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg,rgba(37,99,235,0.3),rgba(37,99,235,0.1));
    border:1px solid rgba(37,99,235,0.2); border-bottom:none;
  }
  .podium-1 .podium-bar { height:70px; background:linear-gradient(180deg,rgba(245,200,66,0.25),rgba(245,200,66,0.05)); border-color:rgba(245,200,66,0.3); }
  .podium-2 .podium-bar { height:50px; }
  .podium-3 .podium-bar { height:35px; }

  .standings-list { display:flex;flex-direction:column;gap:6px;margin-bottom:24px; }
  .standing-row {
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
    transition:border-color 0.18s;
  }
  .standing-row:hover{border-color:#253d60;}
  .rank-num { font-size:0.9rem;font-weight:800;color:var(--muted);width:20px;text-align:center; }
  .st-avatar {
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:0.9rem;flex-shrink:0;
  }
  .st-name { flex:1;font-size:0.95rem;font-weight:700;display:flex;align-items:center;gap:5px; }
  .trend { font-size:0.96rem;font-weight:800; }
  .trend.up { color:#22c55e; }
  .trend.down { color:#ef4444; }
  .st-chips { display:flex;gap:5px;align-items:center; }
  .chip { font-size:0.62rem;font-weight:800;padding:2px 6px;border-radius:8px; }
  .c3{background:rgba(34,197,94,0.15);color:var(--green);}
  .c2{background:rgba(245,200,66,0.15);color:var(--gold);}
  .c1{background:rgba(249,115,22,0.15);color:var(--orange);}
  .st-pts { font-size:1.2rem;font-weight:800;color:var(--gold);min-width:44px;text-align:right; }

  /* MATCHES TAB */
  #tabMatches{display:none;}
  .day-label {
    font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;
    color:var(--muted);margin:16px 0 8px;padding:0 4px;
    display:flex;align-items:center;gap:8px;
  }
  .day-label::after{content:'';flex:1;height:1px;background:var(--border);}
  .match-block { background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden; }
  .match-head { display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border); }
  .grp-tag { font-size:0.62rem;font-weight:800;padding:2px 7px;border-radius:6px;background:rgba(245,200,66,0.12);color:var(--gold); }
  .match-teams-str { flex:1;font-size:0.9rem;font-weight:700; }
  .match-time-str { font-size:0.68rem;color:var(--muted); }
  .result-box {
    font-size:1rem;font-weight:800;background:#080f1d;
    padding:4px 12px;border-radius:8px;border:1px solid var(--border);
    min-width:52px;text-align:center;
  }
  .result-box.tbd { color:var(--muted);font-size:0.82rem;border-color:transparent;background:transparent; }
  .result-box.live { color:#fff;border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.12); }
  .live-badge {
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);
    color:#ef4444;font-size:0.62rem;font-weight:800;
    padding:2px 7px;border-radius:20px;white-space:nowrap;letter-spacing:0.3px;
  }
  .live-badge .ldot {
    width:5px;height:5px;border-radius:50%;background:#ef4444;
    animation:pulse 1s infinite;flex-shrink:0;
  }
  .match-block.is-live { border-color:rgba(239,68,68,0.3);box-shadow:0 0 12px rgba(239,68,68,0.08); }
  .tips-grid { display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px 6px; }
  .tip-item {
    display:flex;align-items:center;gap:5px;
    background:#080f1d;border:1px solid var(--border);
    border-radius:9px;padding:4px 8px;transition:border-color 0.15s;
  }
  .tip-item.has-tip { border-color:rgba(34,197,94,0.25); }
  .tip-item.no-tip  { opacity:0.45; }
  .tip-avatar {
    width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:0.55rem;font-weight:800;color:#fff;flex-shrink:0;
  }
  .tip-score { font-size:0.8rem;font-weight:700; }
  .tip-score.hidden { color:var(--muted);font-style:italic;font-weight:400; }
  .tip-pts-badge { font-size:0.62rem;font-weight:800;padding:1px 5px;border-radius:6px; }
  .tp3{background:rgba(34,197,94,0.15);color:var(--green);}
  .tp2{background:rgba(245,200,66,0.15);color:var(--gold);}
  .tp1{background:rgba(249,115,22,0.15);color:var(--orange);}
  .tp0{background:rgba(239,68,68,0.12);color:var(--red);}
  .reveal-hint {
    display:flex;align-items:center;gap:5px;
    margin:0 12px 8px;padding:5px 8px;border-radius:7px;
    background:rgba(37,99,235,0.08);border:1px solid rgba(37,99,235,0.15);
    font-size:0.65rem;color:var(--muted);font-weight:500;
  }

  /* CHART TAB */
  #tabChart{display:none;}
  .chart-wrap {
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px 12px 12px;margin-top:8px;
  }
  .chart-title {
    font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;
    color:var(--muted);margin-bottom:14px;
  }
  .chart-legend {
    display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
  }
  .legend-item {
    display:flex;align-items:center;gap:5px;font-size:0.75rem;font-weight:700;
  }
  .legend-dot { width:10px;height:10px;border-radius:50%;flex-shrink:0; }
  .chart-empty {
    text-align:center;padding:40px 20px;color:var(--muted);font-size:0.88rem;
  }

  #loading{text-align:center;padding:60px 20px;color:var(--muted);}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="../" class="back">←</a>
    <div class="header-text">
      <div class="header-title">⚽ WM 2026 Dashboard</div>
      <div class="header-sub">Familie Voigt · Tippspiel</div>
    </div>
    <div class="live-pill"><div class="live-dot"></div>Live</div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showTab('standings')">🏆 Rangliste</div>
    <div class="tab" onclick="showTab('matches')">⚽ Spiele</div>
    <div class="tab" onclick="showTab('chart')">📈 Verlauf</div>
  </div>
</header>

<main>
  <div id="loading"><div class="spinner"></div>Lade Daten…</div>
  <div id="content" style="display:none">
    <div id="tabStandings"></div>
    <div id="tabMatches"></div>
    <div id="tabChart"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
const SUPABASE_URL='https://mfqsjhrdjncviebqezls.supabase.co';
const SUPABASE_KEY='sb_publishable_vccXpqiZfjyH099V0Ua-Qg_k8dhJ3Vg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const PARTICIPANTS=['Nolan','Leonie','Anna','Georg','Esther','Snezhana','Oliver'];
const COLORS={Nolan:'#2563eb',Leonie:'#db2777',Anna:'#0891b2',Georg:'#d97706',Esther:'#059669',Snezhana:'#7c3aed',Oliver:'#f59e0b'};

let chartInstance=null;

function calcPoints(tip,result){
  if(!tip||!result)return null;
  const[th,ta]=tip.split(':').map(Number);
  const[rh,ra]=result.split(':').map(Number);
  if([th,ta,rh,ra].some(isNaN))return null;
  if(th===rh&&ta===ra)return 3;
  if(th-ta===rh-ra)return 2;
  if(Math.sign(th-ta)===Math.sign(rh-ra))return 1;
  return 0;
}
const ROUND_LABELS={'Rd. 32':'Sechzehntelfinale','Achtelfinale':'Achtelfinale','Viertelfinale':'Viertelfinale','Halbfinale':'Halbfinale','Platz 3':'Spiel um Platz 3','Finale':'Finale'};
function roundLabel(g){if(ROUND_LABELS[g])return ROUND_LABELS[g];if(g&&g.startsWith('Gruppe'))return'Gr.'+g.replace('Gruppe','');return g||'';}

function fmtTime(utc){
  return new Date(utc).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'})+' Uhr';
}

let matches=[],allTips=[],activeTab='standings';

function showTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',
    (tab==='standings'&&i===0)||(tab==='matches'&&i===1)||(tab==='chart'&&i===2)));
  document.getElementById('tabStandings').style.display=tab==='standings'?'block':'none';
  document.getElementById('tabMatches').style.display=tab==='matches'?'block':'none';
  document.getElementById('tabChart').style.display=tab==='chart'?'block':'none';
  if(tab==='chart')renderChart();
}

async function load(){
  const[mRes,tRes]=await Promise.all([
    sb.from('matches').select('*').order('kickoff_utc'),
    sb.from('tips').select('*')
  ]);
  matches=mRes.data||[];
  allTips=tRes.data||[];
  render();
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
  showTab('standings');
}

function render(){
  const now=new Date();
  const tipMap={};
  allTips.forEach(t=>{if(!tipMap[t.match_id])tipMap[t.match_id]={};tipMap[t.match_id][t.participant]=t.tip;});

  // Scores
  const scores={},bd={};
  PARTICIPANTS.forEach(p=>{scores[p]=0;bd[p]={3:0,2:0,1:0};});
  matches.forEach(m=>{
    if(!m.result||new Date(m.kickoff_utc)>now)return;
    PARTICIPANTS.forEach(p=>{
      const pts=calcPoints(tipMap[m.id]?.[p],m.result);
      if(pts!==null){scores[p]+=pts;if(pts>0)bd[p][pts]=(bd[p][pts]||0)+1;}
    });
  });
  const ranked=[...PARTICIPANTS].sort((a,b)=>scores[b]-scores[a]);

  // Assign ranks with ties
  const rankOf={};
  ranked.forEach((p,i)=>{
    if(i===0||scores[p]<scores[ranked[i-1]]){rankOf[p]=i+1;}
    else{rankOf[p]=rankOf[ranked[i-1]];}
  });

  // Trend: Rang vor 24h berechnen
  const ago24=new Date(now.getTime()-24*60*60*1000);
  const scoresYest={};
  PARTICIPANTS.forEach(p=>{scoresYest[p]=0;});
  matches.forEach(m=>{
    if(!m.result||new Date(m.kickoff_utc)>ago24)return;
    PARTICIPANTS.forEach(p=>{
      const pts=calcPoints(tipMap[m.id]?.[p],m.result);
      if(pts!==null)scoresYest[p]+=pts;
    });
  });
  const rankedYest=[...PARTICIPANTS].sort((a,b)=>scoresYest[b]-scoresYest[a]);
  const rankYestOf={};
  rankedYest.forEach((p,i)=>{
    if(i===0||scoresYest[p]<scoresYest[rankedYest[i-1]]){rankYestOf[p]=i+1;}
    else{rankYestOf[p]=rankYestOf[rankedYest[i-1]];}
  });
  const trendOf={};
  PARTICIPANTS.forEach(p=>{
    const diff=rankYestOf[p]-rankOf[p]; // positiv = besser
    trendOf[p]=diff>0?'up':diff<0?'down':'';
  });

  // STANDINGS TAB
  const rankGroups={};
  ranked.forEach(p=>{const r=rankOf[p];if(r<=3)(rankGroups[r]=rankGroups[r]||[]).push(p);});
  const podiumSlots=[{rank:2,medal:'🥈'},{rank:1,medal:'🥇'},{rank:3,medal:'🥉'}];
  const podiumHtml=`<div class="podium">${podiumSlots.map(({rank,medal})=>{
    const group=rankGroups[rank]||[];
    if(!group.length)return'';
    const small=group.length>1;
    const avatarsHtml=group.map(p=>`<div class="podium-avatar${small?' small':''}" style="background:${COLORS[p]}">${p[0]}</div>`).join('');
    const namesHtml=group.map(p=>`<div class="podium-name${small?' small':''}">${p}</div>`).join('');
    return`<div class="podium-item podium-${rank}">
      <div class="podium-medal">${medal}</div>
      <div class="podium-pts">${scores[group[0]]}</div>
      <div class="podium-avatars">${avatarsHtml}</div>
      <div class="podium-names">${namesHtml}</div>
      <div class="podium-bar"></div>
    </div>`;
  }).join('')}</div>`;

  const listHtml=ranked.map(p=>`
    <div class="standing-row">
      <div class="rank-num">${rankOf[p]}.</div>
      <div class="st-avatar" style="background:${COLORS[p]}">${p[0]}</div>
      <div class="st-name">${p}${trendOf[p]==='up'?'<span class="trend up">↑</span>':trendOf[p]==='down'?'<span class="trend down">↓</span>':''}</div>
      <div class="st-chips">
        ${bd[p][3]>0?`<span class="chip c3">✓✓✓×${bd[p][3]}</span>`:''}
        ${bd[p][2]>0?`<span class="chip c2">✓✓×${bd[p][2]}</span>`:''}
        ${bd[p][1]>0?`<span class="chip c1">✓×${bd[p][1]}</span>`:''}
      </div>
      <div class="st-pts">${scores[p]}</div>
    </div>`).join('');

  document.getElementById('tabStandings').innerHTML=podiumHtml+`<div class="standings-list">${listHtml}</div>`;

  // MATCHES TAB
  const cutoff=new Date(now.getTime()-24*60*60*1000);
  const showOld=window._showOldMatches||false;
  const visibleMatches=showOld?matches:matches.filter(m=>new Date(m.kickoff_utc)>=cutoff);
  const hiddenCount=matches.length-visibleMatches.length;
  const localDateKey=utc=>new Date(utc).toLocaleDateString('sv-SE',{timeZone:'Europe/Berlin'});
  const byDate={};
  visibleMatches.forEach(m=>{const k=localDateKey(m.kickoff_utc);(byDate[k]=byDate[k]||[]).push(m);});
  const toggleHtml=hiddenCount>0&&!showOld
    ?`<div style="text-align:center;margin-bottom:14px"><button onclick="window._showOldMatches=true;render()" style="background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--muted);font-size:0.8rem;font-weight:600;padding:8px 18px;border-radius:20px;cursor:pointer;font-family:inherit">🕓 ${hiddenCount} ältere Spiele einblenden</button></div>`
    :showOld?`<div style="text-align:center;margin-bottom:14px"><button onclick="window._showOldMatches=false;render()" style="background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--muted);font-size:0.8rem;font-weight:600;padding:8px 18px;border-radius:20px;cursor:pointer;font-family:inherit">✕ Alte Spiele ausblenden</button></div>`
    :'';
  const matchesHtml=toggleHtml+Object.entries(byDate).map(([date,ms])=>{
    const visible=ms.filter(m=>m.home!=='?'&&m.away!=='?');
    if(!visible.length)return'';
    const rows=visible.map(m=>{
      const started=new Date(m.kickoff_utc)<=now;
      const isLive=!m.result&&m.live_score;
      const resultHtml=m.result
        ?`<div class="result-box">${m.result}</div>`
        :isLive
          ?`<div class="result-box live">${m.live_score}</div>`
          :`<div class="result-box tbd">${started?'–:–':'–:–'}</div>`;
      const liveBadgeHtml=isLive
        ?`<span class="live-badge"><span class="ldot"></span>${m.live_status||'Live'}</span>`
        :'';
      const tippedCount=PARTICIPANTS.filter(p=>tipMap[m.id]?.[p]).length;
      const hintHtml=!started
        ?`<div class="reveal-hint">🔒 Tipps werden nach Anstoß aufgedeckt · ${tippedCount}/7 haben getippt</div>`
        :'';
      const tipsHtml=PARTICIPANTS.map(p=>{
        const tip=tipMap[m.id]?.[p];
        const pts=calcPoints(tip,m.result);
        const hasTip=!!tip;
        let scoreStr,hidden;
        if(started){scoreStr=tip||'–';hidden=!tip;}
        else{scoreStr=hasTip?'✓':'–';hidden=!hasTip;}
        const ptsBadge=pts!==null&&started&&tip?`<span class="tip-pts-badge tp${pts}">${pts}</span>`:'';
        return`<div class="tip-item${hasTip?' has-tip':' no-tip'}">
          <div class="tip-avatar" style="background:${COLORS[p]}">${p[0]}</div>
          <span class="tip-score${hidden?' hidden':''}">${scoreStr}</span>
          ${ptsBadge}
        </div>`;
      }).join('');
      const kickoffStr=new Date(m.kickoff_utc).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'})+' Uhr';
      const isKO=m.group_name&&!m.group_name.startsWith('Gruppe');
      const leftTag=!started&&!isLive
        ?`<span class="grp-tag">${kickoffStr}</span>${isKO?`<span class="grp-tag" style="background:rgba(99,102,241,0.15);color:#a5b4fc;border-color:rgba(99,102,241,0.3)">${roundLabel(m.group_name)}</span>`:''}`
        :isLive?''
        :`<span class="grp-tag">${roundLabel(m.group_name)}</span>`;
      return`<div class="match-block${isLive?' is-live':''}">
        <div class="match-head">
          ${leftTag}
          <span class="match-teams-str">${m.home} – ${m.away}</span>
          ${liveBadgeHtml}
          ${resultHtml}
        </div>
        ${hintHtml}<div class="tips-grid">${tipsHtml}</div>
      </div>`;
    }).join('');
    const dateObj=new Date(date+'T12:00:00');
    const dayLabel=dateObj.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
    return`<div class="day-label">📅 ${dayLabel}</div>${rows}`;
  }).join('');
  document.getElementById('tabMatches').innerHTML=matchesHtml;

  // Re-render chart if visible
  if(activeTab==='chart')renderChart();
}

function renderChart(){
  const now=new Date();
  const tipMap={};
  allTips.forEach(t=>{if(!tipMap[t.match_id])tipMap[t.match_id]={};tipMap[t.match_id][t.participant]=t.tip;});

  // Only matches with results, sorted by kickoff
  const played=matches.filter(m=>m.result&&new Date(m.kickoff_utc)<=now);

  if(!played.length){
    document.getElementById('tabChart').innerHTML=`<div class="chart-empty">Noch keine Ergebnisse vorhanden.</div>`;
    chartInstance=null;
    return;
  }

  // Group matches by date, build cumulative points per day
  const byDate={};
  played.forEach(m=>{
    const d=m.match_date||m.kickoff_utc.slice(0,10);
    if(!byDate[d])byDate[d]=[];
    byDate[d].push(m);
  });
  const dates=Object.keys(byDate).sort();

  const cumPts={};
  PARTICIPANTS.forEach(p=>cumPts[p]=0);
  const rankHistory={};
  PARTICIPANTS.forEach(p=>rankHistory[p]=[]);
  const labels=[];

  dates.forEach(date=>{
    byDate[date].forEach(m=>{
      PARTICIPANTS.forEach(p=>{
        cumPts[p]+=(calcPoints(tipMap[m.id]?.[p],m.result)??0);
      });
    });
    // rank after this day
    const sorted=[...PARTICIPANTS].sort((a,b)=>cumPts[b]-cumPts[a]);
    PARTICIPANTS.forEach(p=>{
      let rank=sorted.indexOf(p)+1;
      if(rank>1&&cumPts[p]===cumPts[sorted[rank-2]])rank=rankHistory[sorted[rank-2]][rankHistory[sorted[rank-2]].length-1]??rank;
      rankHistory[p].push(rank);
    });
    labels.push(date); // already in "11.06." format
  });

  const datasets=PARTICIPANTS.map(p=>({
    label:p,
    data:rankHistory[p],
    borderColor:COLORS[p],
    backgroundColor:COLORS[p]+'33',
    borderWidth:2.5,
    pointRadius:played.length>20?0:3,
    pointHoverRadius:5,
    tension:0.3,
    fill:false,
  }));

  document.getElementById('tabChart').innerHTML=`
    <div class="chart-wrap">
      <div class="chart-title">📈 Tabellenplatz-Verlauf</div>
      <canvas id="progressChart"></canvas>
      <div class="chart-legend">${PARTICIPANTS.map(p=>`
        <div class="legend-item">
          <div class="legend-dot" style="background:${COLORS[p]}"></div>${p}
        </div>`).join('')}
      </div>
    </div>`;

  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  const ctx=document.getElementById('progressChart').getContext('2d');
  chartInstance=new Chart(ctx,{
    type:'line',
    data:{labels,datasets},
    options:{
      responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#0c1a30',
          borderColor:'#1a2f50',
          borderWidth:1,
          titleColor:'#e8eef8',
          bodyColor:'#e8eef8',
          titleFont:{family:'Inter',weight:'700'},
          bodyFont:{family:'Inter'},
          callbacks:{
            title:items=>labels[items[0].dataIndex]||'',
            label:item=>`${item.dataset.label}: Platz ${item.raw}`,
          }
        }
      },
      scales:{
        x:{
          ticks:{
            color:'#607090',font:{family:'Inter',size:9},
            maxRotation:45,
            callback:(val,i)=>labels[i]||'',
          },
          grid:{color:'rgba(26,47,80,0.6)'},
        },
        y:{
          reverse:true,
          min:1,
          max:PARTICIPANTS.length,
          ticks:{
            color:'#607090',font:{family:'Inter',size:11},stepSize:1,
            callback:v=>Number.isInteger(v)?`${v}.`:'',
          },
          grid:{color:'rgba(26,47,80,0.6)'},
        }
      }
    }
  });
}

// Live updates via Realtime
sb.channel('dashboard')
  .on('postgres_changes',{event:'*',schema:'public',table:'matches'},p=>{const m=matches.find(x=>x.id===p.new.id);if(m){m.result=p.new.result;m.live_score=p.new.live_score;m.live_status=p.new.live_status;}render();})
  .on('postgres_changes',{event:'*',schema:'public',table:'tips'},p=>{const i=allTips.findIndex(t=>t.id===p.new.id);if(i>=0)allTips[i]=p.new;else allTips.push(p.new);render();})
  .subscribe();

// Polling-Fallback: alle 15s alle laufenden/gerade gestarteten Spiele aktualisieren
async function pollLive(){
  const now=new Date();
  const anyStarted=matches.some(m=>!m.result&&new Date(m.kickoff_utc)<=now);
  if(!anyStarted)return;
  const{data}=await sb.from('matches').select('id,result,live_score,live_status');
  if(!data)return;
  let changed=false;
  data.forEach(row=>{
    const m=matches.find(x=>x.id===row.id);
    if(m&&(m.live_score!==row.live_score||m.live_status!==row.live_status||m.result!==row.result)){
      m.live_score=row.live_score;m.live_status=row.live_status;m.result=row.result;changed=true;
    }
  });
  if(changed)render();
}
setInterval(pollLive,15000);

load();
</script>
