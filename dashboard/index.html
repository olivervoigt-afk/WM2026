<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard – WM 2026 Tippspiel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1628; color: #fff; min-height: 100vh; }
  header { background: #0d1f3c; padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1e3a5f; position: sticky; top: 0; z-index: 20; }
  .back { color: #8899bb; text-decoration: none; font-size: 1.2rem; }
  header h1 { font-size: 1.1rem; font-weight: 700; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; animation: pulse 1.5s infinite; margin-left: auto; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }

  /* Standings */
  .section-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #8899bb; margin: 20px 0 10px; }
  .standings { background: #0d1f3c; border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
  .standing-row { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #0a1628; gap: 12px; transition: background 0.15s; }
  .standing-row:last-child { border-bottom: none; }
  .standing-row.rank-1 { background: linear-gradient(90deg, #2a1f00, #0d1f3c); }
  .standing-row.rank-2 { background: linear-gradient(90deg, #1a1f2a, #0d1f3c); }
  .standing-row.rank-3 { background: linear-gradient(90deg, #1a2518, #0d1f3c); }
  .rank { width: 24px; font-size: 1.1rem; text-align: center; }
  .rank-1 .rank::before { content: '🥇'; }
  .rank-2 .rank::before { content: '🥈'; }
  .rank-3 .rank::before { content: '🥉'; }
  .rank-n { color: #4a6a9a; font-size: 0.9rem; font-weight: 600; }
  .name { flex: 1; font-weight: 700; font-size: 1rem; }
  .pts { font-size: 1.4rem; font-weight: 800; color: #f0c040; min-width: 50px; text-align: right; }
  .pts-label { font-size: 0.75rem; color: #8899bb; margin-left: 3px; font-weight: 400; }
  .breakdown { display: flex; gap: 8px; margin-left: auto; }
  .chip { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 8px; }
  .chip-3 { background: #1a4d2a; color: #4caf50; }
  .chip-2 { background: #3d3000; color: #f0c040; }
  .chip-1 { background: #3d2000; color: #ff9800; }

  /* Match table */
  .match-section { margin-bottom: 32px; }
  .day-header { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #8899bb; margin: 20px 0 8px; padding: 0 4px; }
  .match-row { background: #0d1f3c; border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
  .match-header { display: flex; align-items: center; padding: 10px 14px; gap: 10px; border-bottom: 1px solid #0a1628; }
  .group-tag { font-size: 0.65rem; font-weight: 700; color: #f0c040; background: #1e3a1a; padding: 2px 6px; border-radius: 6px; }
  .teams { flex: 1; font-size: 0.92rem; font-weight: 600; }
  .result-badge { font-size: 0.95rem; font-weight: 800; color: #fff; background: #1e3a5f; padding: 3px 10px; border-radius: 8px; min-width: 52px; text-align: center; }
  .result-badge.tbd { color: #4a6a9a; background: transparent; font-size: 0.8rem; }
  .kickoff { font-size: 0.68rem; color: #4a6a9a; }
  .tips-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 10px; }
  .tip-chip { display: flex; align-items: center; gap: 5px; background: #132035; border-radius: 8px; padding: 4px 9px; font-size: 0.78rem; }
  .tip-name { color: #8899bb; font-weight: 500; }
  .tip-val { font-weight: 700; color: #fff; }
  .tip-pts { font-size: 0.7rem; font-weight: 800; padding: 1px 5px; border-radius: 6px; margin-left: 2px; }
  .p3 { background: #1a4d2a; color: #4caf50; }
  .p2 { background: #3d3000; color: #f0c040; }
  .p1 { background: #3d2000; color: #ff9800; }
  .p0 { background: #2a0000; color: #f44336; }
  .no-tip { color: #2a3a55; font-style: italic; }

  #loading { text-align: center; padding: 60px 20px; color: #4a6a9a; }
  .spinner { width: 32px; height: 32px; border: 3px solid #1e3a5f; border-top-color: #4a90d9; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .updated { font-size: 0.68rem; color: #2a3a55; margin-left: auto; }
</style>
</head>
<body>
<header>
  <a href="../" class="back">←</a>
  <h1>📊 Dashboard &amp; Rangliste</h1>
  <div class="live-dot" title="Live"></div>
</header>

<main>
  <div id="loading"><div class="spinner"></div>Lade Daten…</div>
  <div id="content" style="display:none">
    <div class="section-title">🏆 Rangliste</div>
    <div class="standings" id="standings"></div>

    <div class="section-title" style="margin-top:28px">⚽ Alle Spiele</div>
    <div id="matchList"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mfqsjhrdjncviebqezls.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vccXpqiZfjyH099V0Ua-Qg_k8dhJ3Vg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PARTICIPANTS = ['Nolan','Leonie','Anna','Georg','Ester','Snezhana','Oliver'];

function calcPoints(tip, result) {
  if (!tip || !result) return null;
  const [th, ta] = tip.split(':').map(Number);
  const [rh, ra] = result.split(':').map(Number);
  if ([th,ta,rh,ra].some(isNaN)) return null;
  if (th === rh && ta === ra) return 3;
  if (th - ta === rh - ra) return 2;
  if (Math.sign(th - ta) === Math.sign(rh - ra)) return 1;
  return 0;
}

function fmtKickoff(utc) {
  return new Date(utc).toLocaleString('de-DE', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'}) + ' Uhr';
}

let matches = [], allTips = [];

async function load() {
  const [mRes, tRes] = await Promise.all([
    sb.from('matches').select('*').order('kickoff_utc'),
    sb.from('tips').select('*')
  ]);
  matches = mRes.data || [];
  allTips = tRes.data || [];
  render();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function render() {
  const now = new Date();

  // Build tip lookup: match_id -> participant -> tip
  const tipMap = {};
  allTips.forEach(t => {
    if (!tipMap[t.match_id]) tipMap[t.match_id] = {};
    tipMap[t.match_id][t.participant] = t.tip;
  });

  // Standings
  const scores = {};
  const breakdown = {};
  PARTICIPANTS.forEach(p => { scores[p] = 0; breakdown[p] = {3:0,2:0,1:0}; });

  matches.forEach(m => {
    if (!m.result) return;
    const started = new Date(m.kickoff_utc) <= now;
    if (!started) return;
    PARTICIPANTS.forEach(p => {
      const tip = tipMap[m.id]?.[p];
      const pts = calcPoints(tip, m.result);
      if (pts !== null) {
        scores[p] += pts;
        if (pts > 0) breakdown[p][pts] = (breakdown[p][pts]||0) + 1;
      }
    });
  });

  const ranked = [...PARTICIPANTS].sort((a,b) => scores[b]-scores[a]);
  document.getElementById('standings').innerHTML = ranked.map((p, i) => {
    const rank = i + 1;
    const rankHtml = rank <= 3 ? `<div class="rank"></div>` : `<div class="rank rank-n">${rank}</div>`;
    const bd = breakdown[p];
    return `<div class="standing-row rank-${rank<=3?rank:'n'}">
      ${rankHtml}
      <div class="name">${p}</div>
      <div class="breakdown">
        ${bd[3]>0?`<span class="chip chip-3">✓✓✓ ×${bd[3]}</span>`:''}
        ${bd[2]>0?`<span class="chip chip-2">✓✓ ×${bd[2]}</span>`:''}
        ${bd[1]>0?`<span class="chip chip-1">✓ ×${bd[1]}</span>`:''}
      </div>
      <div class="pts">${scores[p]}<span class="pts-label">Pkt</span></div>
    </div>`;
  }).join('');

  // Match list
  const byDate = {};
  matches.forEach(m => (byDate[m.match_date] = byDate[m.match_date] || []).push(m));

  document.getElementById('matchList').innerHTML = Object.entries(byDate).map(([date, ms]) => {
    const rows = ms.map(m => {
      const started = new Date(m.kickoff_utc) <= now;
      const resultHtml = m.result
        ? `<div class="result-badge">${m.result}</div>`
        : `<div class="result-badge tbd">${started?'läuft':'–:–'}</div>`;

      const tipsHtml = PARTICIPANTS.map(p => {
        const tip = tipMap[m.id]?.[p];
        if (!started) {
          return `<div class="tip-chip"><span class="tip-name">${p}</span><span class="tip-val no-tip">?</span></div>`;
        }
        if (!tip) return `<div class="tip-chip"><span class="tip-name">${p}</span><span class="tip-val no-tip">–</span></div>`;
        const pts = calcPoints(tip, m.result);
        const ptsHtml = pts !== null ? `<span class="tip-pts p${pts}">${pts}</span>` : '';
        return `<div class="tip-chip"><span class="tip-name">${p}</span><span class="tip-val">${tip}</span>${ptsHtml}</div>`;
      }).join('');

      return `<div class="match-row">
        <div class="match-header">
          <span class="group-tag">Gr.${m.group_name}</span>
          <span class="teams">${m.home} – ${m.away}</span>
          ${resultHtml}
        </div>
        <div class="tips-row">${tipsHtml}</div>
      </div>`;
    }).join('');

    return `<div class="match-section">
      <div class="day-header">📅 ${date.replace('.','')} Juni</div>
      ${rows}
    </div>`;
  }).join('');
}

// Live updates
sb.channel('dashboard')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, payload => {
    const m = matches.find(x => x.id === payload.new.id);
    if (m) m.result = payload.new.result;
    render();
  })
  .on('postgres_changes', { event: '*', schema: 'public', table: 'tips' }, payload => {
    const existing = allTips.findIndex(t => t.id === payload.new.id);
    if (existing >= 0) allTips[existing] = payload.new;
    else allTips.push(payload.new);
    render();
  })
  .subscribe();

load();
</script>
</body>
</html>
