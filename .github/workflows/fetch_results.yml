name: Ergebnisse automatisch abrufen

on:
  workflow_dispatch: # Wird von cron-job.org jede Minute getriggert

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Ergebnisse abrufen und eintragen (alle 10 Sek.)
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          SUPABASE_URL: https://mfqsjhrdjncviebqezls.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          for i in {1..6}; do
            python scripts/fetch_results.py
            if [ $i -lt 6 ]; then sleep 10; fi
          done
